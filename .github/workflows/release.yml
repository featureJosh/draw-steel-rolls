# Barebones analogue to aeris-bg3-rolls GitLab tag pipeline:
# tag push → install → lint/typecheck → build → stamp metadata → zip dist → GitHub Release → Foundry release.
# Optional: changelog section "## vX.Y.Z" in CHANGELOG.md becomes release notes.
name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.9

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm type-check

            - name: Lint
              run: pnpm lint

            - name: Production build
              run: pnpm run build:ci

            - name: Set manifest release metadata
              env:
                  TAG_NAME: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  VERSION="${TAG_NAME#v}"
                  MODULE_ID="$(jq -r .id dist/module.json)"
                  ZIP_NAME="${MODULE_ID}.zip"
                  MANIFEST_URL="https://github.com/${REPOSITORY}/releases/latest/download/module.json"
                  DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${ZIP_NAME}"

                  jq \
                    --arg ver "$VERSION" \
                    --arg manifest "$MANIFEST_URL" \
                    --arg download "$DOWNLOAD_URL" \
                    '.version = $ver | .manifest = $manifest | .download = $download' \
                    dist/module.json > dist/module.json.tmp
                  mv dist/module.json.tmp dist/module.json

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  MODULE_ID="$(jq -r .id dist/module.json)"
                  ZIP_NAME="${MODULE_ID}.zip"
                  NOTES="${RUNNER_TEMP}/release-notes.md"
                  CLIP="${RUNNER_TEMP}/changelog-snippet.md"

                  (cd dist && zip -rq "../${ZIP_NAME}" .)

                  TAG_HEADING="## ${TAG_NAME}"
                  if [ -f CHANGELOG.md ]; then
                    awk -v h="$TAG_HEADING" '$0 == h {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "${CLIP}"
                  fi
                  if [ -f "${CLIP:-}" ] && [ -s "${CLIP}" ]; then
                    mv "${CLIP}" "${NOTES}"
                  else
                    rm -f "${CLIP:-}"
                    printf 'Release `%s`.\n' "${TAG_NAME}" > "${NOTES}"
                  fi

                  gh release create "${TAG_NAME}" "${ZIP_NAME}" "dist/module.json#module.json" \
                    --title "Release ${TAG_NAME}" \
                    --notes-file "${NOTES}"

            - name: Publish Foundry VTT Release
              env:
                  FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  if [ -z "${FOUNDRY_TOKEN}" ]; then
                    echo "FOUNDRY_RELEASE_TOKEN secret is not configured." >&2
                    exit 1
                  fi

                  VERSION="${TAG_NAME#v}"
                  MODULE_ID="$(jq -r .id dist/module.json)"
                  MINIMUM="$(jq -r '.compatibility.minimum // ""' dist/module.json)"
                  VERIFIED="$(jq -r '.compatibility.verified // ""' dist/module.json)"
                  MAXIMUM="$(jq -r '.compatibility.maximum // ""' dist/module.json)"
                  MANIFEST_URL="$(jq -r .manifest dist/module.json)"
                  NOTES_URL="https://github.com/${REPOSITORY}/releases/tag/${TAG_NAME}"
                  PAYLOAD="${RUNNER_TEMP}/foundry-release.json"
                  RESPONSE="${RUNNER_TEMP}/foundry-response.json"

                  jq -n \
                    --arg id "$MODULE_ID" \
                    --arg version "$VERSION" \
                    --arg manifest "$MANIFEST_URL" \
                    --arg notes "$NOTES_URL" \
                    --arg minimum "$MINIMUM" \
                    --arg verified "$VERIFIED" \
                    --arg maximum "$MAXIMUM" \
                    '{
                      id: $id,
                      release: {
                        version: $version,
                        manifest: $manifest,
                        notes: $notes,
                        compatibility: {
                          minimum: $minimum,
                          verified: $verified,
                          maximum: $maximum
                        }
                      }
                    }' > "$PAYLOAD"

                  STATUS="$(
                    curl -sS -o "$RESPONSE" -w "%{http_code}" \
                      -X POST "https://foundryvtt.com/_api/packages/release_version/" \
                      -H "Content-Type: application/json" \
                      -H "Authorization: ${FOUNDRY_TOKEN}" \
                      --data @"$PAYLOAD"
                  )"

                  if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
                    echo "Foundry release failed with HTTP ${STATUS}." >&2
                    cat "$RESPONSE" >&2
                    exit 1
                  fi
