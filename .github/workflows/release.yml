name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        name: Build and publish release
        runs-on: ubuntu-latest
        env:
            PACKAGE_NAME: draw-steel-rolls
            RELEASE_TAG: ${{ github.ref_name }}
            FOUNDRY_API_TOKEN: ${{ secrets.FOUNDRY_API_TOKEN }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.9

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm type-check

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm run ci

            - name: Prepare release manifest
              run: pnpm release:manifest

            - name: Extract changelog notes
              run: |
                  awk -v tag="## ${RELEASE_TAG}" '
                    $0 == tag {flag=1; next}
                    /^## / && flag {exit}
                    flag {print}
                  ' CHANGELOG.md > release-notes.md

                  if [ ! -s release-notes.md ]; then
                    echo "No changelog entry found for ${RELEASE_TAG} in CHANGELOG.md"
                    exit 1
                  fi

            - name: Package module
              run: |
                  ZIP_NAME="${PACKAGE_NAME}-${RELEASE_TAG}.zip"
                  cd dist
                  zip -r "../${ZIP_NAME}" .

            - name: Create or update GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ZIP_NAME="${PACKAGE_NAME}-${RELEASE_TAG}.zip"

                  if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                    gh release edit "${RELEASE_TAG}" \
                      --title "Release ${RELEASE_TAG}" \
                      --notes-file release-notes.md
                    gh release upload "${RELEASE_TAG}" \
                      "${ZIP_NAME}" \
                      "dist/module.json#module.json" \
                      --clobber
                  else
                    gh release create "${RELEASE_TAG}" \
                      "${ZIP_NAME}" \
                      "dist/module.json#module.json" \
                      --title "Release ${RELEASE_TAG}" \
                      --notes-file release-notes.md
                  fi

            - name: Publish package version to Foundry
              if: env.FOUNDRY_API_TOKEN != ''
              run: |
                  VERSION="${RELEASE_TAG#v}"
                  MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/module.json"
                  NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
                  COMPATIBILITY="$(jq -c '.compatibility' dist/module.json)"

                  jq -n \
                    --arg id "${PACKAGE_NAME}" \
                    --arg version "${VERSION}" \
                    --arg manifest "${MANIFEST_URL}" \
                    --arg notes "${NOTES_URL}" \
                    --argjson compatibility "${COMPATIBILITY}" \
                    '{
                      id: $id,
                      "dry-run": false,
                      release: {
                        version: $version,
                        manifest: $manifest,
                        notes: $notes,
                        compatibility: $compatibility
                      }
                    }' > foundry-release.json

                  curl --fail-with-body \
                    -X POST https://foundryvtt.com/_api/packages/release_version/ \
                    -H "Content-Type: application/json" \
                    -H "Authorization: ${FOUNDRY_API_TOKEN}" \
                    --data @foundry-release.json
